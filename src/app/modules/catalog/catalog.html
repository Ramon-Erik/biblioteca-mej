<app-page-title
  title="Catálogo"
  subtitle="Veja abaixo o acervo de livros disponíveis para empréstimo."
/>

<app-catalog-filter />

@if (true) {
  <app-min-button icon="bi-plus-lg" (btnClick)="openRegisterModal()">
    cadastrar novo livro
  </app-min-button>
}

@if (books$ | async; as books) {
  <div class="my-4">
    @for (book of books; track book.id) {
      <app-book-card [book]="book" />
    }
  </div>
}
