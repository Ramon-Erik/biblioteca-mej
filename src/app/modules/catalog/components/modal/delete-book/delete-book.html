<div class="modal-header">
  <h5 class="modal-title">Apagar livro</h5>
  <button
    type="button"
    class="btn-close"
    (click)="activeModal.dismiss()"
    aria-label="close"
  ></button>
</div>

<div class="modal-body">
  @let bookC = book();
  @if (bookC && bookC.nomeObra) {
    <p>
      <!-- eslint-disable-next-line -->
      Apagar <strong>{{ bookC.nomeObra }}</strong>?
    </p>
  }
  <div class="text-danger mt-3 py-2 d-flex align-items-center gap-2">
    <small><strong>Atenção:</strong> Esta ação é irreversível.</small>
  </div>
</div>

<div class="modal-footer d-flex align-items-center justify-content-between gap-4">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancelar</button>
  <button type="button" class="btn btn-danger" (click)="confirmDelete()" [disabled]="loading()">
    Apagar livro
  </button>
</div>
