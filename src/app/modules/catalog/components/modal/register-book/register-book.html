<div class="modal-header">
  <h5 class="modal-title fw-bold">Cadastrar Novo Livro</h5>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body">
  <form [formGroup]="bookForm">
    <div class="input-line">
      <app-input
        [isRequired]="true"
        label="Nome da Obra:"
        placeholder="Digite o nome do livro"
        id="nomeObra"
        type="text"
        [control]="getControl('nomeObra')"
      />
    </div>

    <div class="input-line">
      <app-input
        [isRequired]="true"
        label="Autor:"
        placeholder="Nome do autor"
        id="autor"
        type="text"
        [control]="getControl('autor')"
      />
    </div>

    <div class="input-line">
      <app-input
        [isRequired]="true"
        label="Editora:"
        placeholder="Nome da editora"
        id="editora"
        type="text"
        [control]="getControl('editora')"
      />
    </div>

    <div class="input-line">
      <app-input
        label="Volume:"
        placeholder="Ex: 1"
        id="volume"
        type="number"
        [control]="getControl('volume')"
      />
    </div>

    <div class="input-line mt-4">
      <app-textarea
        [isRequired]="true"
        inputId="descricao"
        type="text"
        label="Descrição"
        placeholder="Breve resumo da obra"
        formControlName="descricao"
      />
    </div>

    <div class="input-line">
      <app-input
        [isRequired]="true"
        label="Quantidade:"
        type="number"
        placeholder="0"
        id="quantidade"
        [control]="getControl('quantidade')"
      />
    </div>

    <div class="input-line">
      <app-input
        [isRequired]="true"
        label="URL da Foto de Capa:"
        type="url"
        placeholder="https://res.cloudinary.com/{...}.webp"
        id="fotoCapaUrl"
        [control]="getControl('fotoCapaUrl')"
      />
    </div>

    @if (categories$ | async; as categories) {
      <app-select
        [isRequired]="true"
        class="d-block mt-3"
        inputId="categoriasIds"
        formControlName="categoriasIds"
        [options]="categories"
        label="Categoria Principal"
        placeholder="Escolha a categoria do livro"
        [isMultiple]="true"
        [isInvalid]="isFieldInvalid('categoriasIds')"
        errorMessage="A categoria principal é obrigatória."
      ></app-select>
      <div class="d-flex gap-3 mt-3">
        <button
          type="button"
          class="btn btn-link p-0 text-decoration-none"
          (click)="openNewCategoryModal()"
          appBlurOnClick
        >
          <small>Nova categoria</small>
        </button>
        <button
          type="button"
          class="btn btn-link p-0 text-decoration-none"
          (click)="openDeleteCategoryModal()"
          appBlurOnClick
        >
          <small>Apagar categoria</small>
        </button>
      </div>
    }
  </form>
</div>

<div class="modal-footer d-flex align-items-center justify-content-between gap-4">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancelar</button>
  <app-button-default
    type="primary"
    [disable]="bookForm.invalid || loading()"
    [isLoading]="loading()"
    (clicked)="createBook()"
    title="Cadastrar"
  />
</div>
