<app-page-title title="Alterar senha" subtitle="Recuperar o acesso a sua conta" />

<form [formGroup]="recoverForm">
  <app-input
    label="E-mail"
    placeholder="Digite seu email"
    type="email"
    [control]="email"
    id="email"
    [underLink]="underLinkMensage"
    (underLinkClicked)="reenviarCodigo()"
  />

  @if (codeEnviado()) {
    <app-input
      label="Código de verificação"
      placeholder="Digite o código enviado"
      type="text"
      [control]="code"
      id="code-verify"
    />
  }

  @if (codeEnviado()) {
    <app-input
      label="Nova senha"
      placeholder="Digite sua nova senha"
      type="password"
      [control]="newPassword"
      id="new-password"
    />
    <app-input
      label="Confirmar senha"
      placeholder="Confirme sua nova senha"
      type="password"
      [control]="confirmPassword"
      id="confirm-password"
    />
  }

  <div class="buttons-container">
    @if (!codeEnviado()) {
      <app-button-default
        title="Enviar código"
        [disable]="isFormInvalid"
        (clicked)="enviarCodigo()"
        type="primary"
        [isLoading]="isLoading()"
      />
    }

    @if (codeEnviado()) {
      <app-button-default
        title="Alterar senha"
        [disable]="isFormInvalid || passwordForm.invalid"
        (clicked)="setNewPassword()"
        type="primary"
        [isLoading]="isLoading()"
      />
    }

    <div class="text-center mt-3">
      <app-button-default
        title="Voltar para o login"
        [isSubmit]="false"
        type="tertiary"
        (clicked)="backToLogin()"
        [isLoading]="false"
      />
    </div>
  </div>
</form>
