<app-page-title title="Alterar senha" subtitle="Recuperar o acesso a sua conta" />

<form [formGroup]="recoverForm">
  <app-input
    label="E-mail"
    placeholder="Digite seu email"
    type="email"
    [control]="email"
    id="email"
    [underLink]="underLinkMensage"
    (underLinkClicked)="reenviarCodigo()"
  />

  @if (codeEnviado()) {
    <app-input
      label="Código de verificação"
      placeholder="XXXXXX"
      type="text"
      [control]="code"
      id="code-verify"
    />
  }

  <div class="buttons-container">
    @if (!codeEnviado()) {
      <app-button-default
        title="Enviar código"
        [disable]="isFormInvalid"
        (clicked)="enviarCodigo()"
        type="primary"
        [isLoading]="isLoading()"
      ></app-button-default>
    }

    @if (codeEnviado()) {
      <app-button-default
        title="Verificar código"
        [disable]="isCodeFormInvalid"
        (clicked)="verificarCode()"
        type="primary"
        [isLoading]="isLoading()"
      ></app-button-default>
    }

    <div class="text-center mt-3">
      <app-button-default
        title="Voltar para o login"
        [isSubmit]="false"
        type="tertiary"
        (clicked)="backToLogin()"
        [isLoading]="false"
      ></app-button-default>
    </div>
  </div>
</form>
