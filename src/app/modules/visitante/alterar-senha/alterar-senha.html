<app-page-title title="Alterar senha" subtitle="Recuperar o acesso a sua conta" />
<form action="" [formGroup]="recoverForm" (ngSubmit)="enviarCodigo()">
  <app-input
    label="E-mail"
    placeholder="Digite seu email"
    type="email"
    [control]="emailControl"
    inputId="email"
    [underLink]="underLinkMensage"
  />

  @if (alderyClicked()) {
    <app-input
      label="Código verificação"
      placeholder="XXX-XXX"
      type="number"
      [control]="codeControl"
      inputId="code-verify"
    />
  }

  <div class="buttons-container">
    <app-button-default
      title="Enviar código"
      [disable]="!recoverForm.valid || counter > 0"
      (clicked)="alderyClicked.set(true)"
    ></app-button-default>
  </div>
</form>
