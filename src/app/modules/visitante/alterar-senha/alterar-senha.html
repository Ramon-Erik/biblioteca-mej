<app-page-title title="Alterar senha" subtitle="Recuperar o acesso a sua conta" />
<form action="" [formGroup]="recoverForm" (ngSubmit)="enviarCodigo()">
  <app-input
    label="E-mail"
    placeholder="Digite seu email"
    type="email"
    [control]="emailControl"
    inputId="email"
  />
  @if (counter > 0) {
    <span>Reenviar código em {{ counter }} segundos.</span>
  }

  <div class="buttons-container">
    <app-button-default
      title="Enviar código"
      [disable]="!recoverForm.valid || counter > 0"
    ></app-button-default>
  </div>
</form>
