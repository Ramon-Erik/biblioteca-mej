<app-page-title title="Realizar login" subtitle="Entre na sua conta" />
<form action="" [formGroup]="loginForm" (ngSubmit)="fazerLogin()">
  <app-input
    label="E-mail"
    placeholder="Digite seu email"
    type="email"
    [control]="emailControl"
    inputId="email"
  />
  <app-input
    label="Senha"
    placeholder="Digite sua senha"
    type="password"
    [control]="passwordControl"
    underLink="Alterar senha"
    inputId="password"
    (underLinkClicked)="routeToAlterarSenha()"
  />

  <div class="buttons-container">
    <app-button-default title="Login" [disable]="!loginForm.valid"></app-button-default>
  </div>
</form>
