<div class="container__header">
  <div class="logo">
    <img [src]="logoPath" alt="Logo MEJ" />
    <h1>mej - maranguape</h1>
  </div>
  <div class="menu">
    <button (click)="toogleMenuButton()" [class.botao-ativo]="showMenu">
      <i class="bi bi-list"></i>
    </button>
  </div>
  @if (showMenu) {
    <div class="menu-bar">
      <app-menu></app-menu>
    </div>
  }
</div>
