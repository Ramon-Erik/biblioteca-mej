<div>
  <label for="input-default">{{ label }}</label>
  <input
    class="input"
    [type]="type"
    id="input-default"
    [placeholder]="placeholder"
    [formControl]="control"
  />

  @if (control.invalid && control.touched) {
    <div>
      @for (error of getErrorKeys(); track error) {
        <small>{{ getErrorMessage(error) }}</small>
      }
    </div>
  }
  @if (underLink.length > 0) {
    <button type="button">{{ underLink }}</button>
  }
</div>
