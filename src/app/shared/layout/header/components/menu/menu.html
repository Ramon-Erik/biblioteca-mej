<nav class="w-100 shadow rounded-pill text-white p-1 fs-4">
  <ul class="d-flex m-0 align-items-center justify-content-center gap-4 list-unstyled">
    @for (link of navLinks; track link.icon) {
      <li>
        <a [routerLink]="link.path" class="text-white">
          <i [class]="'bi ' + link.icon"></i>
        </a>
      </li>
    }
    @if (isAdm$ | async; as isAdm) {
      <li>
        <a routerLink="/usuarios" class="text-white">
          <i class="bi-people-fill"></i>
        </a>
      </li>
    }
    @if (isUserLogado$ | async) {
      <li>
        <span
          (click)="logout()"
          (keydown.enter)="logout()"
          (keydown.space)="logout()"
          role="button"
          tabindex="0"
          class="cursor-pointer"
          aria-label="Sair"
        >
          <i class="bi-box-arrow-right"></i>
        </span>
      </li>
    }
  </ul>
</nav>
